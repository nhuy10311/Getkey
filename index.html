<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GET KEY</title>
</head>

<body style="font-family:Arial;text-align:center;margin-top:60px;background:#0b0b0b;color:white;">
  <h2 style="color:#00ffd5;">GET KEY</h2>

  <p>Nhấn nút để lấy key</p>

  <button style="padding:12px 25px;font-size:16px;border:none;border-radius:10px;background:#00ffd5;color:black;cursor:pointer;"
          onclick="makeKey()">
    GET KEY
  </button>

  <div style="margin-top:25px;">
    <input id="key" style="width:320px;font-size:18px;text-align:center;padding:10px;border-radius:10px;border:1px solid #00ffd5;background:#111;color:white;"
           readonly />
  </div>

  <br>

  <button style="padding:12px 25px;font-size:16px;border:none;border-radius:10px;background:#00ffd5;color:black;cursor:pointer;"
          onclick="copyKey()">
    COPY KEY
  </button>

  <script>
    function makeKey(){
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth()+1).padStart(2,'0');
      const d = String(today.getDate()).padStart(2,'0');

      const key = `KEY-${y}${m}${d}-BLACKCAT`;
      document.getElementById("key").value = key;
    }

    function copyKey(){
      const v = document.getElementById("key").value;
      if(!v){
        alert("Bấm GET KEY trước!");
        return;
      }
      navigator.clipboard.writeText(v);
      alert("Đã copy key!");
    }
  </script>
</body>
</html>
